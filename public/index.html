<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050f1f">
<title>ReportFix · Military College of Signals</title>
<link rel="icon" type="image/png" href="/mcs-logo.png">
<style>
:root{
  --ink:#0b1730; --ink2:#475569; --ink3:#7b8aa3; --line:#dde5f0; --bg:#f1f5fb; --card:#fff;
  --brand:#1e4fa8; --brand2:#0b2a5b; --navy:#050f1f; --gold:#d4af37; --gold2:#f1d572;
  --critical:#e11d48; --high:#f97316; --medium:#f59e0b; --low:#10b981;
  --good:#059669; --bad:#e11d48; --r:18px; --navh:68px;
  --shadow:0 1px 2px rgba(11,23,48,.05),0 10px 28px -10px rgba(11,23,48,.16);
  --ease:cubic-bezier(.2,.75,.25,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;font:16px/1.55 "Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;
  background-image:radial-gradient(900px 440px at 90% -100px,rgba(30,79,168,.16),transparent 60%),radial-gradient(700px 380px at -5% 120px,rgba(212,175,55,.13),transparent 55%);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
button{cursor:pointer}
button:active:not(:disabled){transform:scale(.97)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ NAV BAR ============ */
.top{position:sticky;top:0;z-index:60;background:linear-gradient(120deg,#050f1f 0%,#0b2a5b 62%,#14407f 100%);color:#fff;border-bottom:3px solid var(--gold);box-shadow:0 10px 30px -12px rgba(5,15,31,.75)}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 14px)}
.bar{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px;height:var(--navh);display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;margin-right:6px}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold),0 8px 20px -6px rgba(0,0,0,.6);overflow:hidden;flex:none;transition:transform .3s var(--ease)}
.brand:hover .logo{transform:rotate(-6deg) scale(1.06)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.brand .org{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;line-height:1.2}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em;line-height:1.1}
.menus{display:flex;gap:6px;margin-left:8px}
.menu{position:relative}
.mbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid transparent;background:transparent;color:#dbe6ff;border-radius:12px;font-weight:700;letter-spacing:.01em;position:relative;overflow:hidden;transition:background .2s,color .2s,border-color .2s,transform .12s}
.mbtn svg{flex:none}
.mbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.mbtn.on{background:rgba(212,175,55,.16);border-color:rgba(212,175,55,.55);color:#fff}
.mbtn .cur{font-weight:600;color:var(--gold2);font-size:13px}
.mbtn .chev{transition:transform .25s var(--ease)}
.menu.open .mbtn{background:rgba(255,255,255,.14);color:#fff}
.menu.open .chev{transform:rotate(180deg)}
.panel{position:absolute;left:0;top:calc(100% + 10px);width:310px;max-height:min(70vh,520px);overflow:auto;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 30px 70px -18px rgba(5,15,31,.55),0 0 0 1px rgba(11,23,48,.08);padding:8px;
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;pointer-events:none;visibility:hidden;transition:opacity .18s var(--ease),transform .22s var(--ease),visibility 0s .22s}
.menu.open .panel{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.panel::before{content:"";position:absolute;top:-6px;left:26px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-radius:3px;box-shadow:-1px -1px 0 rgba(11,23,48,.08)}
.phead{padding:8px 10px 6px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:7px 10px;border:0;background:transparent;border-radius:12px;text-align:left;position:relative;overflow:hidden;transition:background .15s,transform .12s,padding .15s}
.item:hover,.item:focus-visible{background:#eef3fb;padding-left:14px}
.item.active{background:linear-gradient(90deg,rgba(212,175,55,.2),transparent)}
.item.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--gold)}
.item .nm{font-weight:700;line-height:1.2}
.item .mt{font-size:12.5px;color:var(--ink3)}
.item .tick{margin-left:auto;color:var(--gold);opacity:0;transform:scale(.6);transition:.2s}
.item.active .tick{opacity:1;transform:none}
.item .tchip{margin-left:auto;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:#e8eefb;color:var(--brand2)}
.item.active .tchip{display:none}
.pfoot{border-top:1px solid var(--line);margin:8px 2px 0;padding:10px 6px 4px}
.pfoot .row{display:flex;gap:8px}
.pfoot input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;outline:none;background:#fff;transition:.15s}
.pfoot input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(30,79,168,.14)}
.pbtn{min-height:44px;padding:0 14px;border:0;border-radius:12px;font-weight:800;background:linear-gradient(135deg,#f1d572,#d4af37);color:#201700;position:relative;overflow:hidden;transition:filter .15s}
.pbtn:hover{filter:brightness(1.06)}
.barright{margin-left:auto;display:flex;gap:8px;align-items:center}
.rbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(251,113,133,.5);background:rgba(244,63,94,.16);color:#ffe4e6;font-weight:700;position:relative;overflow:hidden;transition:.15s}
.rbtn:hover{background:rgba(244,63,94,.4)}
.rbtn.armed{background:#e11d48;border-color:#e11d48;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(225,29,72,.25)}}

/* ============ WELCOME STRIP ============ */
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.welcome{margin-top:22px;border-radius:22px;padding:20px 24px;color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:linear-gradient(115deg,#0b2a5b,#1e4fa8 70%,#2b63c4);box-shadow:0 20px 40px -20px rgba(11,42,91,.7);animation:rise .5s var(--ease) both}
.welcome::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.35),transparent 65%);pointer-events:none}
.welcome .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:800}
.welcome h2{margin:2px 0 6px;font-size:28px;letter-spacing:-.02em}
.wpills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.welcome .hint{margin-left:auto;max-width:330px;font-size:14px;color:#dbe6ff;position:relative;z-index:1}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.avatar.lg{width:62px;height:62px;font-size:22px}

nav.tabsnav{max-width:1200px;margin:20px auto 0;padding:0 20px}
.seg{display:inline-flex;gap:4px;padding:5px;background:#e3e9f5;border-radius:16px;flex-wrap:wrap;position:relative}
.seg button{border:0;background:transparent;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;color:var(--ink2);position:relative;overflow:hidden;transition:color .2s,background .2s,box-shadow .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 3px 10px -3px rgba(11,23,48,.25)}
main{max-width:1200px;margin:0 auto;padding:20px 20px 40px}

/* ============ SHARED ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;position:relative;overflow:hidden;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms);transition:transform .25s var(--ease),box-shadow .25s}
.spot::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(212,175,55,.16),transparent 70%)}
.spot:hover::after{opacity:1}
.card:hover{box-shadow:0 18px 40px -16px rgba(11,23,48,.28)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bump{animation:bump .3s var(--ease)}.shake{animation:shake .4s}
h2.sec{font-size:26px;letter-spacing:-.02em;margin:6px 0 4px}
h3{font-size:18px;margin:0 0 10px}
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sechead .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;background:var(--navy);padding:3px 10px;border-radius:999px}
.sechead h3{margin:0}
.muted{color:var(--ink2)}.tiny{font-size:13px;color:var(--ink3)}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 22px;font-weight:800;transition:transform .12s,filter .15s,box-shadow .2s;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 12px 24px -10px rgba(11,42,91,.8)}
.btn.pri:hover{filter:brightness(1.1);box-shadow:0 16px 30px -10px rgba(11,42,91,.9)}
.btn:disabled{opacity:.65;cursor:wait}
.sbtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;font-size:14.5px;transition:border-color .15s,color .15s,background .15s,transform .12s;margin:2px 6px 2px 0;position:relative;overflow:hidden}
.sbtn:hover{border-color:var(--brand);color:var(--brand)}
.sbtn.ok{background:var(--good);color:#fff;border-color:var(--good)}.sbtn.ok:hover{color:#fff;filter:brightness(1.08)}
.sbtn.bad{background:#fff1f2;color:var(--bad);border-color:#fecdd3}.sbtn.bad:hover{background:var(--bad);color:#fff}
.sbtn.solid{background:var(--brand);color:#fff;border-color:var(--brand)}.sbtn.solid:hover{color:#fff;filter:brightness(1.1)}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(30,79,168,.14)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* hero + results */
.hero{background:linear-gradient(135deg,#fff,#f1f6fd);border:1px solid #d6e2f5;border-top:4px solid var(--gold)}
.hero textarea{min-height:130px;resize:vertical;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.ex{border:1px dashed #b7c8e6;background:#eaf1fc;color:#17408a;border-radius:999px;min-height:40px;padding:0 14px;font-size:14px;transition:.15s;position:relative;overflow:hidden}
.ex:hover{background:#dbe8fb;border-style:solid;transform:translateY(-1px)}
.places{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.place{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13.5px;color:var(--ink2)}
button.place{min-height:40px;transition:.15s}button.place:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.result{margin-top:16px;border-radius:16px;padding:18px;border:1px solid;animation:rise .4s var(--ease) both}
.result.good{background:#ecfdf5;border-color:#a7f3d0}.result.warn{background:#fffbeb;border-color:#fde68a}.result.err{background:#fff1f2;border-color:#fecdd3}.result.conf{background:#f5f3ff;border-color:#ddd6fe}
.result h4{margin:0 0 10px;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.fact{background:#fff;border:1px solid rgba(11,23,48,.08);border-radius:14px;padding:10px 14px;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
.fact span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:800}
.fact b{font-size:16px}
.spin{width:16px;height:16px;border:2.5px solid rgba(30,79,168,.25);border-top-color:var(--brand);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:s}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 80ms);transition:transform .25s var(--ease)}
.step:hover{transform:translateY(-4px)}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--navy);color:var(--gold);margin-bottom:10px}
.step b{display:block;margin-bottom:2px}
.step p{margin:0;color:var(--ink2);font-size:14.5px}

/* badges */
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.02em;margin:0 5px 5px 0;white-space:nowrap}
.b.critical{background:var(--critical);color:#fff}.b.high{background:var(--high);color:#fff}.b.medium{background:#fef3c7;color:#92400e}.b.low{background:#d1fae5;color:#065f46}
.b.st-new{background:#dbeafe;color:#1e40af}.b.st-in_progress{background:#ffedd5;color:#9a3412}.b.st-resolved{background:#d1fae5;color:#065f46}
.b.st-closed{background:#e2e8f0;color:#334155}.b.st-reopened{background:#ffe4e6;color:#9f1239}.b.st-invalid{background:#e2e8f0;color:#64748b;text-decoration:line-through}
.b.dept{background:#dbeafe;color:#1e3a8a}.b.flag{background:#fee2e2;color:#991b1b}.b.you{background:#e0f2fe;color:#075985}.b.neutral{background:#f1f5f9;color:#475569}
.b.conf{background:#4c1d95;color:#fff}

/* issue cards */
.issue{padding-left:26px}
.issue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--bar,#cbd5e1)}
.issue.t-critical{--bar:var(--critical)}.issue.t-high{--bar:var(--high)}.issue.t-medium{--bar:var(--medium)}.issue.t-low{--bar:var(--low)}
.issue.t-critical::before{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px 2px rgba(225,29,72,.55)}}
.issue.confc{--bar:#6d28d9;background:linear-gradient(135deg,#fff,#faf5ff)}
.ihead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:6px}
.ihead .id{color:var(--ink3);font-weight:800}
.ihead .ttl{font-weight:800;font-size:18px;letter-spacing:-.01em}
.reason{color:var(--ink2);margin:2px 0 12px}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;align-items:center}
.metric{display:inline-flex;align-items:center;gap:6px;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:14px;color:var(--ink2)}
.metric b{color:var(--ink)}
.meter{height:8px;border-radius:99px;background:#e9eef7;overflow:hidden;min-width:120px;flex:1;max-width:240px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--bar,#6366f1);animation:grow .9s var(--ease) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.vote{background:#f6f8fc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}
.vbar{display:flex;height:11px;border-radius:99px;overflow:hidden;background:#e2e8f0;margin:9px 0}
.vbar .c{background:var(--good)}.vbar .d{background:var(--bad)}
.quote{border-left:3px solid var(--gold);background:#fbf8ec;border-radius:0 12px 12px 0;padding:8px 14px;margin:8px 0;font-size:15px}
.quote small{display:block;color:var(--ink3);font-weight:700}
.acts{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.acts input.in{width:240px;padding:9px 12px;font-size:14.5px;min-height:44px}
.acts select.in{width:auto;padding:9px 12px;font-size:14.5px;min-height:44px}
details{margin-top:10px}details summary{cursor:pointer;color:var(--ink3);font-size:14px;font-weight:700;list-style:none;min-height:32px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}details summary::before{content:"▸ ";margin-right:4px}details[open] summary::before{content:"▾ "}
.tl{list-style:none;margin:8px 0 0 6px;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;font-size:14px;color:var(--ink2);padding:4px 0}
.tl li::before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #fff}

/* stat + dept + user cards */
.stats,.snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms);transition:transform .25s var(--ease)}
.stat:hover{transform:translateY(-3px)}
.stat::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--sc,var(--brand))}
.stat.c1{--sc:var(--critical)}.stat.c2{--sc:var(--brand)}.stat.c3{--sc:var(--good)}.stat.c4{--sc:var(--high)}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:800}
.stat b{display:block;font-size:34px;letter-spacing:-.03em;line-height:1.15;color:var(--sc,var(--ink))}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.dcard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .25s var(--ease),border-color .2s,box-shadow .2s;position:relative;overflow:hidden;text-align:left;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms);min-height:96px}
.dcard:hover{transform:translateY(-4px);border-color:var(--brand)}
.dcard.on{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.35)}
.dcard .dn{font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--brand2)}
.dcard .dm{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--ink2)}
.dcard .dm b{color:var(--ink);font-size:18px;display:block;line-height:1.1}
.dcard .crit{position:absolute;top:12px;right:12px;margin:0}
.gauge{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.big{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tbar{height:14px;border-radius:99px;background:linear-gradient(90deg,#fecdd3,#fde68a,#a7f3d0);position:relative;flex:1;min-width:200px}
.tbar i{position:absolute;top:-5px;width:7px;height:24px;border-radius:4px;background:var(--ink);transform:translateX(-3px);transition:left .8s var(--ease)}
.ledger{width:100%;border-collapse:collapse;margin-top:14px}
.ledger td,.ledger th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
.ledger th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.delta{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:2px 9px;font-weight:800;font-size:14px}
.delta.up{background:#d1fae5;color:#065f46}.delta.down{background:#ffe4e6;color:#9f1239}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.ucard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms);transition:transform .25s var(--ease)}
.ucard:hover{transform:translateY(-4px)}
.urow{display:flex;align-items:center;gap:12px}
.mini{height:9px;border-radius:99px;background:#e9eef7;overflow:hidden}.mini i{display:block;height:100%;border-radius:99px;animation:grow .9s var(--ease) both;transform-origin:left}
.empty{text-align:center;padding:50px 20px;color:var(--ink3)}
.empty svg{opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--ink2);font-size:17px}
pre.sum{white-space:pre-wrap;background:#f6f8fc;border:1px solid var(--line);border-radius:14px;padding:16px;font:15px/1.6 inherit;margin:14px 0 0}
footer{max-width:1200px;margin:10px auto 30px;padding:18px 20px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
footer b{color:var(--ink2)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,24px) scale(.96);background:#1e293b;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 16px 36px -8px rgba(11,23,48,.55);opacity:0;pointer-events:none;transition:.28s var(--ease);z-index:80;font-weight:700;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}#toast.err{background:#be123c}#toast.ok{background:#047857}

/* cursor */
#cur,#cdot{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;opacity:0;will-change:transform}
#cur{width:36px;height:36px;margin:-18px 0 0 -18px;border:1.5px solid var(--gold);border-radius:50%;transition:width .22s var(--ease),height .22s var(--ease),margin .22s var(--ease),background .2s,opacity .2s}
#cdot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1px rgba(5,15,31,.5)}
#cur.hov{width:56px;height:56px;margin:-28px 0 0 -28px;background:rgba(212,175,55,.16)}
#cur.down{width:26px;height:26px;margin:-13px 0 0 -13px;background:rgba(212,175,55,.4)}
#cur.txt{width:3px;height:26px;margin:-13px 0 0 -1.5px;border-radius:2px;background:var(--gold)}
.hascur #cur,.hascur #cdot{opacity:1}
@media (pointer:coarse){#cur,#cdot{display:none}}

@media (max-width:860px){
  .bar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:8px 10px}
  .menus{order:3;width:100%;margin:0;overflow-x:auto;padding-bottom:4px}
  .barright{margin-left:auto}
  .panel{position:fixed;left:12px;right:12px;top:auto;width:auto;max-height:62vh}
  .panel::before{display:none}
  .welcome .hint{margin-left:0;max-width:none}
  .welcome h2{font-size:24px}
}
@media (max-width:560px){.brand .org{display:none}.mbtn .cur{display:none}.wrap,main,nav.tabsnav{padding-left:14px;padding-right:14px}.acts input.in{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="sr" href="#view">Skip to content</a>
<div id="cur" aria-hidden="true"></div><div id="cdot" aria-hidden="true"></div>

<header class="top">
  <div class="bar">
    <a class="brand" href="#" aria-label="ReportFix home">
      <div class="logo" id="logo"><img src="/mcs-logo.png" alt="Military College of Signals" onerror="this.parentNode.innerHTML=MONO"></div>
      <div><div class="org">Military College of Signals</div><h1>ReportFix</h1></div>
    </a>
    <nav class="menus" id="menus" aria-label="Sign in as"></nav>
    <div class="barright"><button class="rbtn" id="resetBtn" type="button">Reset all data</button></div>
  </div>
</header>

<div class="wrap"><section class="welcome" id="who" aria-live="polite"></section></div>
<nav class="tabsnav"><div class="seg" id="tabs" role="tablist"></div></nav>
<div id="toast" role="status"></div>
<main id="view"></main>
<footer><span><b>ReportFix</b> · Military College of Signals</span><span>CodeQuest 2026 · AI Module · AI reads the text, plain code makes every decision</span></footer>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let me = null, users = [], tab = null, places = [], lastReport = null, deptFilter = null;

/* ---------- haptics: real vibration on phones, visual bump everywhere (kept short and only for confirmations) ---------- */
function haptic(kind, el) {
  if (!reduced && navigator.vibrate) navigator.vibrate({ light: 8, medium: 16, success: [12, 40, 20], error: [30, 40, 30] }[kind] || 8);
  if (el && !reduced) { const c = kind === 'error' ? 'shake' : 'bump'; el.classList.remove('bump', 'shake'); void el.offsetWidth; el.classList.add(c); }
}

const EXAMPLES = [
  'Lab 3 mein WiFi nahi chal raha',
  'There is a small fire near the printer in Lab 2, no rush',
  'LAB 4 PROJECTOR NOT WORKING!!! URGENT!!!',
  'Library ka AC kharab hai, bohat garmi hai',
  'Wifi is not working in Lab 9',
];
const ROLE_COLOR = { student: 'linear-gradient(135deg,#3b82f6,#1e4fa8)', staff: 'linear-gradient(135deg,#d4af37,#b8860b)', admin: 'linear-gradient(135deg,#334155,#0f172a)' };
const initials = n => String(n || '?').split(/\s+/).filter(w => /^\p{L}/u.test(w.replace(/^\(/, ''))).map(w => w.replace(/^\(/, '')[0]).slice(0, 2).join('').toUpperCase() || '?';
const avatar = (name, role, cls) => `<span class="avatar ${cls || ''}" style="background:${ROLE_COLOR[role] || '#64748b'}">${esc(initials(name))}</span>`;
const TIER_LABEL = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };
const STATUS_LABEL = { new: 'New', in_progress: 'In progress', resolved: 'Resolved - awaiting students', closed: 'Closed (verified)', reopened: 'Reopened', invalid: 'Marked fake' };
const IC = {
  student: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>',
  staff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  admin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  chev: '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  tick: '<svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
};
const MENU_DEF = [
  { role: 'student', label: 'Student', head: 'Sign in as a student' },
  { role: 'staff', label: 'Department', head: 'Sign in as department staff' },
  { role: 'admin', label: 'Admin', head: 'Sign in as admin' },
];
// Generic "MCS" monogram, shown only until the official logo file is placed at public/mcs-logo.png
const MONO = '<svg width="42" height="42" viewBox="0 0 52 52" aria-label="MCS"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12315c"/><stop offset="1" stop-color="#050f1f"/></linearGradient></defs><path d="M26 3l20 6v15c0 12-8.5 20-20 25C14.5 44 6 36 6 24V9z" fill="url(#mg)" stroke="#d4af37" stroke-width="2"/><g fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"><path d="M17 17a13 13 0 0 1 18 0"/><path d="M20.5 20.5a8 8 0 0 1 11 0"/></g><circle cx="26" cy="24" r="1.8" fill="#d4af37"/><text x="26" y="41" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#fff" letter-spacing="1">MCS</text></svg>';

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', 'x-user-id': localStorage.uid || '' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { data: j, status: r.status });
  return j;
}

let toastT;
function toast(m, kind = 'err') { const t = $('#toast'); t.textContent = m; t.className = 'show ' + kind; clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3200); if (kind === 'err') haptic('error'); }

/* ================= NAVIGATION: Student / Department / Admin menus ================= */
function menuItems(def) {
  const list = users.filter(u => u.role === def.role);
  const items = list.map(u => {
    const meta = u.role === 'student' ? 'Student · trust ' + u.trust : u.role === 'staff' ? u.dept + ' department staff' : 'Registrar, full access';
    const name = u.role === 'staff' ? u.dept + ' Staff' : u.name;
    return `<button class="item ${u.id === localStorage.uid ? 'active' : ''}" role="menuitem" data-u="${u.id}">${avatar(u.name, u.role)}<span><span class="nm">${esc(name)}</span><br><span class="mt">${esc(meta)}</span></span>${u.role === 'student' ? `<span class="tchip">${u.trust}</span>` : ''}${IC.tick}</button>`;
  }).join('');
  const foot = def.role === 'student' ? `<div class="pfoot"><div class="phead" style="padding:0 0 6px">New student account</div><div class="row"><input id="newName" placeholder="Student name" aria-label="New student name" maxlength="40"><button class="pbtn" data-act="create" type="button">Create</button></div></div>` : '';
  return `<div class="phead">${def.head}</div>${items}${foot}`;
}
function renderMenus() {
  const cur = users.find(u => u.id === localStorage.uid);
  $('#menus').innerHTML = MENU_DEF.map(def => {
    const on = cur && cur.role === def.role;
    const who = on ? (cur.role === 'staff' ? cur.dept : cur.role === 'admin' ? '' : cur.name.split(' ')[0]) : '';
    return `<div class="menu" data-role="${def.role}"><button class="mbtn ${on ? 'on' : ''}" type="button" aria-haspopup="menu" aria-expanded="false">${IC[def.role]}<span>${def.label}</span>${who ? `<span class="cur">· ${esc(who)}</span>` : ''}${IC.chev}</button>
      <div class="panel" role="menu" aria-label="${def.head}">${menuItems(def)}</div></div>`;
  }).join('');
}
const openMenu = () => $('.menu.open');
function closeMenus(focusBtn) {
  $$('.menu.open').forEach(m => { m.classList.remove('open'); const b = m.querySelector('.mbtn'); b.setAttribute('aria-expanded', 'false'); if (focusBtn) b.focus(); });
}
function toggleMenu(m) {
  const wasOpen = m.classList.contains('open');
  closeMenus();
  if (wasOpen) return;
  m.classList.add('open'); const b = m.querySelector('.mbtn'); b.setAttribute('aria-expanded', 'true');
  haptic('light');
  const p = m.querySelector('.panel');
  if (matchMedia('(max-width:860px)').matches) p.style.top = (b.getBoundingClientRect().bottom + 8) + 'px'; else p.style.top = '';
  (p.querySelector('.item.active') || p.querySelector('.item'))?.focus({ preventScroll: true });
}
async function switchTo(id, btn) {
  localStorage.uid = id; lastReport = null; deptFilter = null;
  haptic('success', btn);
  closeMenus(); await loadUsers(); await setUser(); window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
  const u = users.find(x => x.id === id); if (u) toast('Signed in as ' + (u.role === 'staff' ? u.dept + ' Staff' : u.name), 'ok');
}
async function createStudent() {
  const inp = $('#newName'); const name = (inp.value || '').trim() || 'New Student';
  try { const u = await api('/users', { method: 'POST', body: { name } }); localStorage.uid = u.id; haptic('success'); closeMenus(); await loadUsers(); await setUser(); toast(`Created ${u.name} (trust 50) and signed in`, 'ok'); }
  catch (e) { toast(e.message); }
}
$('#menus').addEventListener('click', e => {
  const mb = e.target.closest('.mbtn'); if (mb) return toggleMenu(mb.closest('.menu'));
  const it = e.target.closest('.item'); if (it) return switchTo(it.dataset.u, it);
  if (e.target.closest('[data-act=create]')) return createStudent();
});
$('#menus').addEventListener('keydown', e => {
  const m = e.target.closest('.menu'); if (!m) return;
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); return createStudent(); }
  if (m.classList.contains('open') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = [...m.querySelectorAll('.item')]; const i = items.indexOf(document.activeElement);
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); e.preventDefault();
  }
  if (e.key === 'ArrowDown' && e.target.classList.contains('mbtn') && !m.classList.contains('open')) { toggleMenu(m); e.preventDefault(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openMenu()) closeMenus(true); });
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });

async function loadUsers() { users = await api('/users'); if (!users.find(u => u.id === localStorage.uid)) localStorage.uid = users.find(u => u.role === 'student').id; if (!openMenu()) renderMenus(); }

const ROLE_HINT = { student: 'Report problems, back an existing issue with "Me too", and confirm whether a fix really worked.', staff: 'Work your department\'s queue, most important first, and mark issues resolved with a note.', admin: 'Oversee every department, confidential cases, trust scores and the AI summary.' };
function paintWho(u) {
  const roleTxt = u.role === 'staff' ? `${u.dept} staff` : u.role === 'admin' ? 'Admin' : 'Student';
  const w = u.trust != null ? Math.max(0.1, Math.min(2, u.trust / 50)).toFixed(1) : null;
  $('#who').innerHTML = `${avatar(u.name, u.role, 'lg')}<div><div class="eyebrow">Signed in as</div><h2>${esc(u.name)}</h2>
    <div class="wpills"><span class="pill">${esc(roleTxt)}</span>${w ? `<span class="pill">Trust ${u.trust}</span><span class="pill">Vote weight ×${w}</span>` : ''}</div></div>
    <div class="hint">${esc(ROLE_HINT[u.role])}</div>`;
}
async function setUser() {
  me = await api('/me'); paintWho(me);
  const tabs = me.role === 'student' ? ['Report', 'My issues', 'Public board', 'My trust'] : me.role === 'staff' ? ['Queue'] : ['All issues', 'Confidential', 'Users & trust', 'Trending', 'Summary'];
  if (!tabs.includes(tab)) tab = tabs[0];
  $('#tabs').innerHTML = tabs.map(t => `<button role="tab" aria-selected="${t === tab}" class="${t === tab ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  render();
}
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.t) { tab = b.dataset.t; lastReport = null; haptic('light', b); setUser(); } };
let resetArmed = false;
$('#resetBtn').onclick = async e => {
  const b = e.currentTarget;
  if (!resetArmed) { resetArmed = true; b.classList.add('armed'); b.textContent = 'Click again to confirm'; haptic('medium'); setTimeout(() => { resetArmed = false; b.classList.remove('armed'); b.textContent = 'Reset all data'; }, 4000); return; }
  resetArmed = false; b.classList.remove('armed'); b.textContent = 'Reset all data';
  await api('/reset', { method: 'POST' }); localStorage.uid = ''; lastReport = null; deptFilter = null; await loadUsers(); await setUser(); haptic('success'); toast('All data reset', 'ok');
};

/* ================= CARDS ================= */
const badge = (cls, t) => `<span class="b ${cls}">${esc(t)}</span>`;
const emptyState = (title, sub) => `<div class="card empty"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg><b>${esc(title)}</b>${esc(sub || '')}</div>`;
const section = (eyebrow, title) => `<div class="sechead"><span class="eyebrow">${esc(eyebrow)}</span><h3>${esc(title)}</h3></div>`;

function issueCard(i, mode) {
  if (i.confidential) {
    return `<div class="card spot issue confc"><div class="ihead"><span class="id">#${i.id}</span><span class="ttl">${esc(i.title)}</span> ${badge('conf', 'Confidential')} ${badge('st-' + i.status, STATUS_LABEL[i.status] || i.status)}</div>
      <div class="reason">${esc(i.reason || '')}</div>
      ${(i.texts || []).map(t => `<div class="quote"><small>${esc(t.reporter)}</small>${esc(t.text)}</div>`).join('')}
      ${mode === 'admin' && i.status !== 'closed' ? `<div class="acts"><button class="sbtn ok" onclick="act(${i.id},'resolved')">Close case</button></div>` : ''}
      ${i.history ? `<details><summary>Activity</summary><ul class="tl">${i.history.map(h => `<li>${esc(h.text)}</li>`).join('')}</ul></details>` : ''}</div>`;
  }
  const staffLike = me.role === 'staff' || me.role === 'admin';
  let acts = '';
  if (me.role === 'student') {
    if (i.canJoin) acts += `<button class="sbtn solid" onclick="join(${i.id})">Me too · I'm affected (${i.supporters})</button>`;
    if (i.canVote) acts += `<button class="sbtn ok" onclick="vote(${i.id},'confirm')">Confirm it's fixed</button><button class="sbtn bad" onclick="vote(${i.id},'dispute')">Still broken</button>`;
    if (i.myVote) acts += badge('neutral', 'You voted: ' + (i.myVote === 'confirm' ? 'fixed' : 'still broken'));
  } else {
    if (['new', 'reopened'].includes(i.status)) acts += `<button class="sbtn solid" onclick="act(${i.id},'in_progress')">Start work</button>`;
    if (['new', 'in_progress', 'reopened'].includes(i.status)) acts += `<input class="in" id="note-${i.id}" placeholder="What was done? (shown to students)" aria-label="Resolution note"> <button class="sbtn ok" onclick="resolve(${i.id})">Mark resolved</button>`;
    if (!['closed', 'invalid'].includes(i.status)) acts += `<button class="sbtn bad" onclick="act(${i.id},'invalid')">Mark fake / spam</button>`;
    if (me.role === 'admin') acts += `<select class="in" aria-label="Reassign department" onchange="reassign(${i.id},this.value)"><option value="">Reassign…</option>${['EE', 'CSE', 'IS', 'Library', 'Cafeteria', 'Labs'].map(d => `<option>${d}</option>`).join('')}</select>`;
  }
  const vp = i.voteProgress;
  const vote = vp ? `<div class="vote"><b>Did the fix work?</b> <span class="tiny">${vp.affected} affected student(s) decide</span>
      <div class="vbar"><div class="c" style="width:${vp.affected ? vp.confirms / vp.affected * 100 : 0}%"></div><div class="d" style="width:${vp.affected ? vp.disputes / vp.affected * 100 : 0}%"></div></div>
      <span class="tiny">${vp.confirms} confirm · ${vp.disputes} dispute · ${Math.max(0, vp.affected - vp.confirms - vp.disputes)} waiting</span>${i.resolvedNote ? `<div class="tiny" style="margin-top:4px">Staff note: ${esc(i.resolvedNote)}</div>` : ''}</div>` : '';
  const raised = i.tier !== i.baseTier;
  return `<div class="card spot issue t-${i.tier}">
    <div class="ihead"><span class="id">#${i.id}</span><span class="ttl">${esc(i.title)}</span></div>
    <div>${badge(i.tier, TIER_LABEL[i.tier] + (raised ? ' ↑ crowd' : ''))}${badge('st-' + i.status, STATUS_LABEL[i.status] || i.status)}${badge('dept', i.dept)}
      ${i.safety ? badge('flag', 'Safety hazard') : ''}${i.brigading ? badge('flag', 'Brigading suspected') : ''}${i.reopenCount ? badge('st-reopened', 'Reopened ×' + i.reopenCount) : ''}${i.mine ? badge('you', 'You reported / joined') : ''}</div>
    <div class="reason">${esc(i.reason || '')}</div>
    <div class="metrics"><span class="metric"><b>${i.supporters}</b> affected</span><span class="metric"><b>${i.credibleSupporters}</b> credible</span><span class="metric">support weight <b>${i.weightedSupport}</b></span>
      <span class="meter" title="Importance score ${i.score}"><i style="width:${Math.min(100, i.score / 1.2)}%"></i></span></div>
    ${vote}
    ${staffLike && i.texts ? i.texts.slice(0, 3).map(t => `<div class="quote"><small>${t.reporter ? esc(t.reporter) + ' · ' : ''}${t.injection ? 'contained instructions - ignored' : 'report'}</small>${esc(t.text)}</div>`).join('') : ''}
    ${me.role === 'admin' && i.supporterList ? `<div class="tiny">Supporters: ${i.supporterList.map(s => esc(s.name) + ' (trust ' + s.trust + ')').join(', ')}</div>` : ''}
    ${acts ? `<div class="acts">${acts}</div>` : ''}
    ${i.history && i.history.length ? `<details><summary>Activity (${i.history.length})</summary><ul class="tl">${i.history.slice(-6).map(h => `<li>${esc(h.text)}</li>`).join('')}</ul></details>` : ''}
  </div>`;
}
const statCard = (cls, label, n, sub) => `<div class="stat ${cls}"><span>${label}</span><b data-n="${n}">${n}</b>${sub ? `<div class="tiny">${sub}</div>` : ''}</div>`;
function statsBar(a) {
  const open = a.filter(i => ['new', 'in_progress', 'reopened'].includes(i.status));
  return `<div class="stats">${statCard('c2', 'Open issues', open.length)}${statCard('c1', 'Critical', open.filter(i => i.tier === 'critical').length)}${statCard('c4', 'Awaiting student check', a.filter(i => i.status === 'resolved').length)}${statCard('c3', 'Closed (verified)', a.filter(i => i.status === 'closed').length)}</div>`;
}
function studentSnap(a) {
  const open = a.filter(i => ['new', 'in_progress', 'reopened'].includes(i.status)).length;
  const vote = a.filter(i => i.canVote).length;
  const fixed = a.filter(i => i.status === 'closed').length;
  const w = Math.max(0.1, Math.min(2, me.trust / 50)).toFixed(1);
  return `<div class="snap">${statCard('c2', 'My trust score', me.trust, 'vote weight ×' + w)}${statCard('c4', 'My open issues', open, 'being worked on')}${statCard('c1', 'Needs my vote', vote, 'did the fix work?')}${statCard('c3', 'Fixed & verified', fixed, 'confirmed by students')}</div>`;
}
const DEPT_LIST = ['EE', 'CSE', 'IS', 'Library', 'Cafeteria', 'Labs'];
function deptCards(a) {
  return `<div class="dgrid">${DEPT_LIST.map(d => {
    const mine = a.filter(i => i.dept === d), open = mine.filter(i => ['new', 'in_progress', 'reopened'].includes(i.status));
    const crit = open.filter(i => i.tier === 'critical').length, wait = mine.filter(i => i.status === 'resolved').length;
    return `<button class="dcard spot ${deptFilter === d ? 'on' : ''}" onclick="setDept('${d}')" aria-pressed="${deptFilter === d}">${crit ? `<span class="b critical crit">${crit} critical</span>` : ''}<div class="dn">${d}</div>
      <div class="dm"><span><b>${open.length}</b>open</span><span><b>${wait}</b>to verify</span><span><b>${mine.length}</b>total</span></div></button>`;
  }).join('')}</div>`;
}
window.setDept = d => { deptFilter = deptFilter === d ? null : d; haptic('light'); render(); };
const HOW = [['Report', 'Say it your way: English, Roman Urdu or a mix, typos and all.'], ['AI reads it', 'Finds the place, the problem and any danger. Ignores tone and tricks.'], ['Code decides', 'Plain rules pick the department and priority, and group duplicates.'], ['Students verify', 'Only affected students confirm or dispute the fix.']];

/* ================= RENDER ================= */
const viewEl = $('#view'); let lastHtml = null;
function afterPaint() {
  [...viewEl.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 9)));
  $$('#view .stats>*,#view .snap>*,#view .dgrid>*,#view .ugrid>*,#view .steps>*,#view .facts>*').forEach((c, i) => c.style.setProperty('--i', Math.min(i, 9)));
  if (reduced) return;
  $$('#view [data-n]').forEach(el => {
    const n = +el.dataset.n; if (!isFinite(n) || n === 0) return; const t0 = performance.now();
    const tick = t => { const p = Math.min(1, (t - t0) / 800); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  });
}
// Only touch the page when the content really changed, so live refresh never eats a click.
const viewProxy = { set innerHTML(h) { if (h === lastHtml) return; lastHtml = h; viewEl.innerHTML = h; afterPaint(); }, get innerHTML() { return viewEl.innerHTML; } };
async function render() {
  const v = viewProxy;
  try {
    if (tab === 'Report') {
      if (!places.length) places = (await api('/meta')).places;
      const snap = studentSnap(await api('/issues?scope=mine'));
      v.innerHTML = snap + `<div class="card spot hero"><h2 class="sec" style="margin-top:0">What's broken on campus?</h2>
        <p class="muted" style="margin:0 0 14px">Write it your way. Say what is wrong and where.</p>
        <textarea class="in" id="txt" placeholder="e.g. Lab 3 mein WiFi nahi chal raha" aria-label="Describe the problem"></textarea>
        <div class="chips"><span class="tiny" style="align-self:center">Try:</span>${EXAMPLES.map(x => `<button class="ex" data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <div style="margin-top:12px"><button class="btn pri" id="sendBtn">Submit report →</button></div>
        <div id="out">${lastReport || ''}</div></div>
        ${section('How it works', 'From report to verified fix')}<div class="steps">${HOW.map((s, k) => `<div class="step"><div class="n">${k + 1}</div><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div>
        ${section('Campus', 'Places on this demo campus')}<div class="card spot"><div class="places">${places.map(p => `<span class="place">${esc(p.name)}</span>`).join('')}</div>
        <p class="tiny" style="margin:12px 0 0">If you name a place that is not here, ReportFix asks you instead of guessing.</p></div>`;
      $('#sendBtn').onclick = submit;
      $$('.ex').forEach(b => b.onclick = () => { $('#txt').value = b.dataset.ex; $('#txt').focus(); haptic('light', b); });
    } else if (tab === 'My issues') {
      const a = await api('/issues?scope=mine'); v.innerHTML = studentSnap(a) + (a.length ? a.map(i => issueCard(i)).join('') : emptyState('Nothing yet', 'Issues you report or join show up here with live status.'));
    } else if (tab === 'Public board') {
      const a = await api('/issues?scope=public'); v.innerHTML = a.length ? `<h2 class="sec">Public board</h2><p class="muted" style="margin-top:0">Most important first. Hit "Me too" if you are affected too.</p>` + a.map(i => issueCard(i)).join('') : emptyState('No issues on the board', 'Be the first to report a problem.');
    } else if (tab === 'My trust') { await showTrust(me.id, v); }
    else if (tab === 'Queue') {
      const a = await api('/issues?scope=dept'); v.innerHTML = `<h2 class="sec">${esc(me.dept)} queue</h2><p class="muted" style="margin-top:0">Most important first. You only see ${esc(me.dept)} issues.</p>` + statsBar(a) + (a.length ? a.map(i => issueCard(i)).join('') : emptyState('Queue is empty', 'New reports for your department appear here.'));
    } else if (tab === 'All issues') {
      const all = await api('/issues?scope=dept'); const a = deptFilter ? all.filter(i => i.dept === deptFilter) : all;
      v.innerHTML = `<h2 class="sec">All departments</h2><p class="muted" style="margin-top:0">Click a department card to filter${deptFilter ? ` (showing ${esc(deptFilter)}, click again to clear)` : ''}.</p>` + statsBar(all) + deptCards(all) + (a.length ? a.map(i => issueCard(i)).join('') : emptyState('No issues yet', 'Sign in as a student and file a report.'));
    } else if (tab === 'Confidential') {
      const a = await api('/issues?scope=confidential'); v.innerHTML = `<div class="card" style="background:#faf5ff;border-color:#ddd6fe"><b>Admin-only.</b> <span class="muted">Harassment and ragging cases never appear on a public board, never reach a department, and the reporter is never revealed.</span></div>` + (a.length ? a.map(i => issueCard(i, 'admin')).join('') : emptyState('No confidential cases', ''));
    } else if (tab === 'Users & trust') {
      const us = (await api('/users')).filter(u => u.role === 'student');
      v.innerHTML = `<h2 class="sec">Students & trust</h2><div class="ugrid">${us.map(u => `<div class="ucard spot"><div class="urow">${avatar(u.name, 'student')}<div><b>${esc(u.name)}</b><div class="tiny">trust ${u.trust} · weight ×${Math.max(0.1, Math.min(2, u.trust / 50)).toFixed(1)}</div></div></div>
        <div class="mini"><i style="width:${u.trust}%;background:${u.trust >= 60 ? '#10b981' : u.trust >= 35 ? '#f59e0b' : '#e11d48'}"></i></div>
        <button class="sbtn" onclick="trustFor('${u.id}')">Why this score?</button></div>`).join('')}</div><div id="trustBox"></div>`;
    } else if (tab === 'Trending') {
      const a = await api('/trending'); v.innerHTML = `<h2 class="sec">Trending</h2><p class="muted" style="margin-top:0">Issues with the most new "me too" joins in the last hour.</p>` + (a.length ? a.map(i => issueCard(i)).join('') : emptyState('Nothing trending', 'Trends appear as students join issues.'));
    } else if (tab === 'Summary') {
      v.innerHTML = `<div class="card spot"><h2 class="sec" style="margin-top:0">Admin summary</h2><p class="muted" style="margin-top:0">A short briefing of what needs attention. Written by AI when available, otherwise by plain rules.</p>
        <button class="btn pri" id="sumBtn">Generate summary</button><pre class="sum" id="sumOut" style="display:none"></pre></div>`;
      $('#sumBtn').onclick = async () => { const o = $('#sumOut'); o.style.display = 'block'; o.textContent = 'Working…'; const s = await api('/admin/summary', { method: 'POST' }); o.textContent = s.text + `\n\n(source: ${s.source === 'ai' ? 'AI' : 'plain rules'})`; haptic('success'); };
    }
  } catch (e) { v.innerHTML = `<div class="result err">${esc(e.message)}</div>`; }
}
async function showTrust(uid, box) {
  const t = await api(`/users/${uid}/trust`); const tr = t.user.trust;
  box.innerHTML = `<div class="card spot"><div class="gauge"><div><div class="big" data-n="${tr}" style="color:${tr >= 60 ? '#059669' : tr >= 35 ? '#d97706' : '#e11d48'}">${tr}</div><div class="tiny">trust score</div></div>
    <div style="flex:1;min-width:220px"><b>${esc(t.user.name)}</b> <span class="muted">· vote weight ×${t.user.weight}</span><div class="tbar" style="margin-top:14px"><i style="left:${tr}%"></i></div><div class="tiny" style="margin-top:8px">${esc(t.explanation)}</div></div></div>
    <table class="ledger"><tr><th>When</th><th>Change</th><th>Why</th></tr>${t.entries.length ? t.entries.map(e => `<tr><td class="tiny">${new Date(e.ts).toLocaleTimeString()}</td><td><span class="delta ${e.delta >= 0 ? 'up' : 'down'}">${e.delta > 0 ? '+' : ''}${e.delta}</span></td><td>${esc(e.reason)}</td></tr>`).join('') : '<tr><td colspan="3" class="tiny">No changes yet. Everyone starts at 50.</td></tr>'}</table></div>`;
}
window.trustFor = id => { showTrust(id, $('#trustBox')); $('#trustBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };

async function submit() {
  const text = $('#txt').value.trim(); if (!text) { haptic('error', $('#txt')); return toast('Please describe the problem first.'); }
  $('#sendBtn').disabled = true; $('#out').innerHTML = '<div class="result" style="background:#eef2ff;border-color:#c7d2fe"><span class="spin"></span>Understanding your report…</div>';
  try {
    const r = await api('/reports', { method: 'POST', body: { text } });
    let html = '';
    if (r.outcome === 'clarify') {
      html = `<div class="result warn"><h4>One more detail, please</h4>${esc(r.message)}<div class="places">${(r.places || []).map(p => `<button class="place" onclick="addPlace('${esc(p)}')">${esc(p)}</button>`).join('')}</div></div>`; haptic('medium');
    } else if (r.outcome === 'duplicate' || r.outcome === 'already_joined') {
      html = `<div class="result warn">${esc(r.message)}</div>`; haptic('medium');
    } else if (r.issue && r.issue.confidential) {
      html = `<div class="result conf"><h4>Received confidentially · Case #${r.issue.id}</h4>${esc(r.issue.reason)}</div>`; haptic('success');
    } else if (r.outcome === 'dispute_via_report') {
      html = `<div class="result good">${esc(r.message)}</div>`; haptic('success');
    } else {
      const t = r.triage;
      html = `<div class="result good"><h4>${r.outcome === 'joined' ? 'Matched an existing issue: you are counted as "me too"' : 'New issue created'} · #${r.issue.id}</h4>
        <div class="facts"><div class="fact"><span>Place</span><b>${esc(t.place)}</b></div><div class="fact"><span>Problem</span><b>${esc(t.type)}</b></div><div class="fact"><span>Routed to</span><b>${esc(t.dept)}</b></div><div class="fact"><span>Priority</span>${badge(r.issue.tier, TIER_LABEL[r.issue.tier])}</div></div>
        <div class="muted">${esc(t.reason)}</div>
        ${t.injectionIgnored ? '<div style="margin-top:8px"><b>Heads up:</b> your text contained instructions aimed at the system. They were ignored and your trust score went down.</div>' : ''}
        <div class="tiny" style="margin-top:8px">${r.issue.supporters} student(s) affected · understood by ${t.usedAI ? 'AI + rules' : 'rules only (AI unavailable)'}</div></div>`; haptic('success');
    }
    lastReport = html; $('#out').innerHTML = html;
    $$('#out .facts>*').forEach((c, i) => c.style.setProperty('--i', i));
    if (r.outcome !== 'clarify') { $('#txt').value = ''; }
    paintWho(await api('/me'));
  } catch (e) { $('#out').innerHTML = `<div class="result err">${esc(e.message)}</div>`; haptic('error'); }
  $('#sendBtn').disabled = false;
}
window.addPlace = p => { const t = $('#txt'); t.value = t.value.trim() + ' (' + p + ')'; t.focus(); };
window.join = async id => { try { await api(`/issues/${id}/join`, { method: 'POST' }); haptic('success'); await setUser(); toast('You are counted on this issue', 'ok'); } catch (e) { toast(e.message); } };
window.vote = async (id, v) => { try { await api(`/issues/${id}/vote`, { method: 'POST', body: { vote: v } }); haptic('success'); await setUser(); toast('Vote recorded', 'ok'); } catch (e) { toast(e.message); } };
window.act = async (id, status, note) => { try { await api(`/issues/${id}/status`, { method: 'POST', body: { status, note } }); haptic('success'); await render(); } catch (e) { toast(e.message); } };
window.resolve = id => { const el = document.getElementById('note-' + id); act(id, 'resolved', el ? el.value : ''); };
window.reassign = async (id, dept) => { if (!dept) return; try { await api(`/issues/${id}/reassign`, { method: 'POST', body: { dept } }); haptic('success'); await render(); toast('Reassigned to ' + dept, 'ok'); } catch (e) { toast(e.message); } };

/* ================= FEEL: cursor glow, card spotlight, click ripple ================= */
(function feel() {
  // click ripple + pressed cursor
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('.btn,.sbtn,.mbtn,.item,.pbtn,.rbtn,.ex,.dcard,.seg button,button.place');
    if (t && !reduced) {
      const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, s = document.createElement('span');
      s.className = 'rip'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
      t.appendChild(s); setTimeout(() => s.remove(), 650);
    }
    $('#cur').classList.add('down');
  });
  document.addEventListener('pointerup', () => $('#cur').classList.remove('down'));
  // card spotlight follows the pointer
  document.addEventListener('pointermove', e => {
    const c = e.target.closest('.spot'); if (!c) return;
    const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });
  // custom cursor: gold ring that trails the pointer and grows over clickable things (native cursor stays visible)
  if (reduced || !matchMedia('(pointer:fine)').matches) return;
  const ring = $('#cur'), dot = $('#cdot'); let x = -100, y = -100, rx = -100, ry = -100;
  document.addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY; document.documentElement.classList.add('hascur');
    dot.style.transform = `translate(${x}px,${y}px)`;
    const el = e.target;
    const hov = el.closest && el.closest('a,button,.item,.mbtn,select,summary,[onclick]'); const txt = el.closest && el.closest('input,textarea');
    ring.classList.toggle('hov', !!hov && !txt); ring.classList.toggle('txt', !!txt);
  }, { passive: true });
  document.addEventListener('pointerleave', () => document.documentElement.classList.remove('hascur'));
  (function loop() { rx += (x - rx) * 0.2; ry += (y - ry) * 0.2; ring.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); })();
})();

// live status: refresh the visible list every 4s (never while someone is typing, never on the report form, never with a menu open)
setInterval(async () => {
  const a = document.activeElement;
  if (!me || openMenu() || ['Report', 'Users & trust', 'Summary'].includes(tab) || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
  try { await render(); paintWho(await api('/me')); await loadUsers(); } catch { }
}, 4000);
(async () => { await loadUsers(); await setUser(); })();
</script>
